# Alembic config. Run from backend/:
#
#   alembic revision --autogenerate -m "create core tables"
#   alembic upgrade head
#
# The URL is read from CARDIOAI_DATABASE_URL at runtime via database/migrations/env.py,
# so sqlalchemy.url is intentionally left blank — never commit credentials here.

[alembic]
script_location = database/migrations
prepend_sys_path = .
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S